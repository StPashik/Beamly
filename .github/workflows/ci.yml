name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install media tools
        run: brew install ffmpeg-full
      - name: Test Swift application and core
        run: Scripts/test.sh
      - name: Build and verify universal release
        run: Scripts/release.sh
      - name: Test installer and inspect npm package
        run: |
          npm test
          npm pack --dry-run
